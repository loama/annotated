<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotated</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">a</span><span>annotated</span></div>
      <div class="actions">
        <button id="open" type="button" aria-label="Open Annotated in a tab" title="Open Annotated in a tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="loading" class="loading" aria-live="polite">
        <div class="pulse"><span></span></div>
        <p>Reading the current page</p>
        <small>Selection and media details move directly into your private draft.</small>
      </section>
      <section id="restricted" class="restricted" hidden>
        <span class="restricted-mark">a</span>
        <h1>Choose a page to annotate.</h1>
        <p id="restricted-message">Click the Annotated toolbar icon on an article, video, or podcast to capture it.</p>
      </section>
      <iframe id="app" title="Annotated capture studio" allow="microphone" hidden></iframe>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
